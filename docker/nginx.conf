server {
    listen 80;
    root /var/www/html/public;
    index index.php;
    client_max_body_size 16m;

    # Upload (foto user, gambar menu, bukti bayar) ada di volume `storage`, bukan
    # di ./public hasil rsync. Alias eksplisit, tidak bergantung symlink public/storage.
    location ^~ /storage/ {
        alias /var/www/html/storage/app/public/;
        access_log off;
        expires 7d;
    }

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        # Nama container, bukan nama service: nginx juga duduk di network `edge`
        # yang dipakai bersama stack lain di vm-gpu, dan di sana `app` resolve ke
        # banyak container milik stack lain (lihat dev-ops/home-server/sipenda.md).
        fastcgi_pass menu-app-php:9000;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
    }
}
