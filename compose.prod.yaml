# Produksi di vm-gpu. Pola: dev-ops/home-server/traefik.md bagian 4.
# Tanpa port yang dipublikasikan — trafik masuk lewat tunnel vm-gpu ke Traefik
# di network `edge`. Jalankan selalu dengan --env-file .env.prod.
services:
  web:
    image: nginx:alpine
    container_name: menu-app
    restart: unless-stopped
    networks: [default, edge]
    volumes:
      # Aset statis (termasuk public/build hasil Vite) dilayani dari hasil rsync.
      - ./public:/var/www/html/public:ro
      - ./docker/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      # Upload ditulis php-fpm ke volume ini; nginx cukup baca.
      - storage:/var/www/html/storage:ro
    labels:
      traefik.enable: "true"
      # Container ini duduk di dua network — beri tahu Traefik yang mana.
      traefik.docker.network: edge
      traefik.http.routers.menuapp.rule: Host(`menu.blataktech.com`)
      traefik.http.services.menuapp.loadbalancer.server.port: "80"
      traefik.http.routers.menuapp.middlewares: sec@docker,gzip@docker
    depends_on: [app]
    logging:
      options:
        max-size: "10m"
        max-file: "3"

  app:
    build:
      context: .
      dockerfile: Dockerfile.prod
    image: menu-app-php:latest
    container_name: menu-app-php
    restart: unless-stopped
    # Sengaja hanya di `default`: PHP-FPM tidak berurusan dengan Traefik.
    networks: [default]
    # .env.prod di-inject sebagai environment, BUKAN di-mount jadi .env — php-fpm
    # jalan sebagai www-data (uid 82) dan tidak bisa baca berkas 600 milik uid 1000.
    env_file: .env.prod
    volumes:
      - storage:/var/www/html/storage
    depends_on:
      db:
        condition: service_healthy
    logging:
      options:
        max-size: "10m"
        max-file: "3"

  db:
    # mariadb:11 sudah ada di vm-gpu — tag ini menghindari pull ~330MB lagi.
    image: mariadb:11
    container_name: menu-app-db
    restart: unless-stopped
    networks: [default]
    environment:
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      MARIADB_DATABASE: ${DB_DATABASE}
      MARIADB_USER: ${DB_USERNAME}
      MARIADB_PASSWORD: ${DB_PASSWORD}
    volumes:
      - db-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect"]
      interval: 5s
      timeout: 5s
      retries: 20
    logging:
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  storage:
  db-data:

networks:
  default:
  edge:
    external: true
